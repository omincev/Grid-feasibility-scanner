name: ci

# Pull requests and pushes to main, except docs-only changes. Method cards (docs/methods) and source dossiers
# (docs/sources) are inputs of the curated loader, the contract checks and the asset metadata, so they still run
# the checks. `paths` with negations instead of `paths-ignore`, which cannot re-include them. The image build and
# the deploy are manual: .github/workflows/image.yml.
on:
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/methods/**"
      - "docs/sources/**"
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/methods/**"
      - "docs/sources/**"

# A newer push to the same pull request or branch stops the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: scanner
          POSTGRES_DB: scanner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scanner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://scanner:scanner@localhost:5432/scanner
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      # Extras too: geometry, browser and PDF code is tested offline (no browser binaries are installed).
      - run: uv sync --all-groups --all-extras
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy
      - run: uv run python -m scanner.core.contracts
      - run: uv run pytest
      - name: Migrations (with PostGIS) and database tests
        run: |
          uv run python scripts/migrate_local.py "$TEST_DATABASE_URL"
          uv run pytest -m db
      # The code locations of workspace.yaml, each on its own (a failure names the location) and together
      # (cross-location lineage: partition mappings between ingestion and analytics assets).
      - name: Dagster definitions load
        run: |
          uv run dagster definitions validate -m scanner.ingestion_definitions
          uv run dagster definitions validate -m scanner.analytics_definitions
          uv run dagster definitions validate -m scanner.ops_definitions
          uv run dagster definitions validate -w workspace.yaml

  holdout:
    # Holdout tests live in a separate repository that workers never see (docs/quality.md).
    # Enable once the repository exists and HOLDOUT_REPO_TOKEN is configured.
    if: false
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/grid-scanner-holdout
          token: ${{ secrets.HOLDOUT_REPO_TOKEN }}
          path: holdout
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --all-groups --all-extras
      - run: uv run pytest holdout
