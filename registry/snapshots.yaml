# Sources that only show current state, watched documents and metadata pages.
# Schema: scanner.core.registry.Snapshot. Every capture goes to the raw store; hash changes are
# recorded in ops.snapshot and trigger on_change. Schedules are cron in the given timezone.
# status: active (watch now) | to_research (URL or method unknown; a research bead must fill it in)
snapshots:
  # Metadata pages: catch dataset retirements and in-place definition changes.
  - id: dk.eds.meta.DayAheadPrices
    url: https://api.energidataservice.dk/meta/dataset/DayAheadPrices
    kind: json
    render: http
    schedule: "0 7 * * *"
    timezone: Europe/Copenhagen
    on_change: research
    owner: misi
    status: active
  - id: dk.eds.meta.ImbalancePrice
    url: https://api.energidataservice.dk/meta/dataset/ImbalancePrice
    kind: json
    render: http
    schedule: "0 7 * * *"
    timezone: Europe/Copenhagen
    on_change: research
    owner: misi
    status: active
  - id: dk.eds.meta.Forecasts_Hour
    url: https://api.energidataservice.dk/meta/dataset/Forecasts_Hour
    kind: json
    render: http
    schedule: "0 7 * * *"
    timezone: Europe/Copenhagen
    on_change: research
    owner: misi
    status: active
  - id: dk.eds.meta.Elspotprices
    url: https://api.energidataservice.dk/meta/dataset/Elspotprices
    kind: json
    render: http
    schedule: "0 7 * * 1"
    timezone: Europe/Copenhagen
    on_change: research
    owner: misi
    status: active

  # Current-state sources whose history is lost unless captured.
  - id: dk.energinet.connection_queue
    url: https://wabi-north-europe-g-primary-api.analysis.windows.net/public/reports/querydata?synchronous=true
    kind: json
    render: http
    method: POST
    headers: {Content-Type: application/json}
    # The public resource key is read from this page's Power BI embed URL on every capture (not stored).
    powerbi_embed_page: https://energinet.dk/el/nyt-anlaeg-i-elnettet/overblik-over-nettilslutningsprojekter/
    # Per-request identifiers and the server timestamp change on every call.
    ignore_keys: [jobIds, jobId, timestamp, rootActivityId]
    body:
      version: 1.0.0
      modelId: 4546001
      cancelQueries: []
      queries:
        - QueryId: ""
          Query:
            Commands:
              - SemanticQueryDataShapeCommand:
                  Query:
                    Version: 2
                    From:
                      - {Name: p, Entity: Dim Placering, Type: 0}
                      - {Name: t, Entity: Dim Type, Type: 0}
                      - {Name: f, Entity: Dim Fase, Type: 0}
                      - {Name: m, Entity: Målinger, Type: 0}
                    Select:
                      - {Column: {Expression: {SourceRef: {Source: p}}, Property: Region}, Name: p.Region}
                      - {Column: {Expression: {SourceRef: {Source: t}}, Property: Type}, Name: t.Type}
                      - {Column: {Expression: {SourceRef: {Source: f}}, Property: Fasenavn}, Name: f.Fasenavn}
                      - {Measure: {Expression: {SourceRef: {Source: m}}, Property: Kapacitet i alt MW}, Name: m.Kapacitet i alt MW}
                      - {Measure: {Expression: {SourceRef: {Source: m}}, Property: Senest opdateret}, Name: m.Senest opdateret}
                  Binding:
                    Primary: {Groupings: [{Projections: [0, 1, 2, 3, 4]}]}
                    DataReduction: {DataVolume: 4, Primary: {Window: {Count: 1000}}}
                    Version: 1
    schedule: "0 6 2 * *"
    timezone: Europe/Copenhagen
    on_change: parse:connection_queue
    owner: misi
    status: active
    note: >-
      Power BI public report behind the queue page: applied MW per region, direction and phase, plus the
      "Senest opdateret" date. Parsed into core.fact on dk.tso_area.<region> (codebook
      energinet.connection_queue). Unofficial endpoint; the embed may change without notice, which the
      page snapshot below catches. See docs/sources/dk/energinet-connection-queue.md.
  - id: dk.energinet.connection_queue.page
    url: https://energinet.dk/el/nyt-anlaeg-i-elnettet/overblik-over-nettilslutningsprojekter/
    kind: web_page
    render: http
    schedule: "0 6 2 * *"
    timezone: Europe/Copenhagen
    on_change: research
    owner: misi
    status: active
    note: "The queue page itself (static HTML with the Power BI embed URLs); a change here can mean a new report version."
  # Danish capacity maps (BEK 1468/2025 section 29). All DSOs publish through one shared ArcGIS service run by
  # Energinet and Green Power Denmark; see docs/sources/dk/dso-capacity-maps.md. Replaced in place each quarter (DSO)
  # or month (TSO), so history is lost unless captured.
