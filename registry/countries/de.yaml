# Reference country: present so its zone can be used as a percentile reference and parsed from
# Energi Data Service DayAheadPrices. Not a target market.
code: de
name: Germany
status: reference
timezone: Europe/Berlin
currency: EUR
reporting_currency: EUR
tso: null
geography_levels: [country, zone]
# EIC checked 2026-10-18 against ENTSO-E's area list (BZN|DE-LU)
# https://transparencyplatform.zendesk.com/hc/en-us/articles/15885757676308 and the EIC registry
# https://eepublicdownloads.blob.core.windows.net/cio-lio/csv/Y_eicCodes.csv (Bidding Zone, Active).
zones:
  - {id: de.zone.de_lu, short: DE, name: Germany-Luxembourg, eic: 10Y1001A1001A82H, eic_verified: true}
# Energi Data Service publishes this zone too (Elspotprices, DayAheadPrices); it stays first so the
# percentile population is unchanged now that ENTSO-E prices arrive.
precedence:
  day_ahead_price: [energidataservice, entsoe]
reference_zones: []
