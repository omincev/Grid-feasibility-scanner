transformation: Queried DAGI_Kommuneinddeling valid now (virkningstid = registreringstid), paged 5 per
  request; dropped kommunekode 411 if present; WKT parsed and reprojected from the CRS reported by the
  service (EPSG:25832) to EPSG:4326 with pyproj (always_xy); shapely simplify(tolerance=0.0002 deg, preserve_topology=True);
  coordinates rounded to 5 decimals; kommunekode mapped to the existing dk.municipality.<slug> entity
  IDs and required to match the registry's 98 codes exactly. Built by scripts/build_geometries.py --source
  dagi.
notes: Replaces the coarse GISCO 1:1M geometries. See docs/sources/dk/dagi.md.
