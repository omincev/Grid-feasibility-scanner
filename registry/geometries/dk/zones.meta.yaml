transformation: Dissolved (shapely unary_union) the unsimplified municipality polygons per bidding zone
  using the parent assignment in registry/entities/dk/entities.yaml, closed seams with a 0.0002 deg buffer/unbuffer,
  then simplified (tolerance 0.0002 deg) and rounded to 5 decimals as for municipalities. DK1 = Jutland,
  Funen and the islands Samsoe, Aeroe, Langeland, Laesoe, Fanoe; DK2 = Zealand, Lolland-Falster, Moen,
  Bornholm. Derived polygons approximate the zones; they are not an official TSO boundary.
