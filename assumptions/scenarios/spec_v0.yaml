title: Specification v0 (behaviour until 18 October)
status: exploratory
description: >-
  Exactly the behaviour the pipeline had before scenarios existed: F7 (share of DSO stations without free
  production capacity) feeds both the zone congestion score and the municipality site scores, and an area
  without data for an input is scored on the inputs it has, with the weights scaled back to 100. Kept to
  reproduce earlier results and as the baseline for comparisons.
