[project]
name = "grid-scanner"
version = "0.1.0"
description = "Grid Opportunity Scanner: ingestion runtime, analytics and valuation"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.8,<2",
    "dagster-webserver>=1.8,<2",
    "dagster-postgres>=0.24",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "polars>=1.0",
    "pandera[polars]>=0.20",
    "duckdb>=1.0",
    "psycopg[binary]>=3.2",
    "fsspec>=2024.6",
    "s3fs>=2024.6",
    "scipy>=1.13",
    "numpy>=1.26",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
pdf = ["pdfplumber>=0.11", "pymupdf>=1.24", "anthropic>=0.40"]
geo = ["shapely>=2.0", "pyproj>=3.6"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a Postgres database at TEST_DATABASE_URL (migrations applied)",
    "live: calls a live source API; never run by coding agents or default CI",
]
addopts = "-m 'not db and not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ", "RUF"]
ignore = ["RUF001", "RUF003"]  # source documents contain Unicode minus signs and non-breaking spaces

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["scanner.core"]
mypy_path = "src"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/scanner/core/db.py" = ["E501"]   # SQL
"tests/test_db.py" = ["E501"]         # SQL
