not_ingested:
  - field: mFRRSAUpEUR
    reason: Identical to ImbalancePrice.mFRRMarginalPriceUpEUR in every quarter-hour and zone of the recorded days (dk.eds.ImbalancePrice.mFRRMarginalPriceUpEUR is already ingested); no new information.
  - field: mFRRSADownEUR
    reason: Identical to ImbalancePrice.mFRRMarginalPriceDownEUR on the recorded days (already ingested); no new information.
  - field: TimeDK
    reason: Local time is never stored (ADR 0001).
