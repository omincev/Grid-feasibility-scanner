entries:
  - id: dk.eds.MfrrCapacityMarketExtra.UpDemandMW
    field: UpDemandMW
    dimensions: {}
    equivalence_class: mfrr_capacity_extra.demand.up
    kind: settlement
    unit: "MW"
    sign_convention: non-negative
    resample: mean
    issued_at: null
    sensitivity: public
    definition:
      source_quote: "UpDemandMW: The local demand for up-regulation capacity in MW sent to the balancing capacity market."
      source_url: https://api.energidataservice.dk/meta/dataset/MfrrCapacityMarketExtra
      ours: "Local demand for upward mFRR reserve capacity sent to the extra afternoon auction, per hour."
    notes: >-
      Null before 2025-08-21, when the source starts the demand columns. Extra auctions are held only when the forecast-based daily procurement falls short.
  - id: dk.eds.MfrrCapacityMarketExtra.UpProcuredMW
    field: UpProcuredMW
    dimensions: {}
    equivalence_class: mfrr_capacity_extra.procured.up
    kind: settlement
    unit: "MW"
    sign_convention: non-negative
    resample: mean
    issued_at: null
    sensitivity: public
    definition:
      source_quote: "UpProcuredMW: The procured volume of up-regulation capacity in MW."
      source_url: https://api.energidataservice.dk/meta/dataset/MfrrCapacityMarketExtra
      ours: "Procured upward mFRR reserve capacity in the extra afternoon auction, per hour."
    notes: >-
      Hourly capacity volume in MW, not energy. Procurement is part of the Nordic mFRR capacity market and
      includes cross-border allocations: procured above demand means capacity exported, below demand means
      capacity imported.
      Zero on hours without an extra auction; zero is a published value, not a gap.
  - id: dk.eds.MfrrCapacityMarketExtra.UpPriceEUR
    field: UpPriceEUR
    dimensions: {}
    equivalence_class: mfrr_capacity_extra.price.up
    kind: settlement
    unit: "EUR/MW"
    sign_convention: null
    resample: mean
    issued_at: null
    sensitivity: public
    definition:
      source_quote: "UpPriceEUR: The marginal price for procured up-regulation capacity in EUR"
      source_url: https://api.energidataservice.dk/meta/dataset/MfrrCapacityMarketExtra
      ours: "Marginal price of procured upward mFRR capacity in the extra afternoon auction, EUR per MW per hour."
    notes: >-
      The source states the unit as EUR per MW (the reservation price per MW for the hour); the hour is implicit
      in the one-hour resolution. Stored as published.
      Null on hours where nothing was procured (no auction held); stays null.
