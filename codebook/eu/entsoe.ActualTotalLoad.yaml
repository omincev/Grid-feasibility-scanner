# ENTSO-E Transparency Platform, TR article 6.1.A, documentType A65, processType A16 (realised).
# Records come from scanner.adapters.entsoe.decode; the zone is the record's out_bidding_zone.
entries:
  - id: eu.entsoe.ActualTotalLoad.quantity
    field: quantity
    dimensions: {business_type: A04}
    equivalence_class: total_load_actual
    kind: actual
    unit: MW
    sign_convention: null
    resample: mean
    issued_at: null
    sensitivity: public
    definition:
      source_quote: >-
        Actual total load per bidding zone per market time unit, the total load being defined as equal
        to the sum of power generated by plants on both TSO/DSO networks, from which the following is
        deduced: the balance (export-import) of exchanges on interconnections between neighbouring
        bidding zones; the power absorbed by energy storage resources. Specification of calculation:
        Average of real-time load values per bidding zone per market time unit. Actual total load
        (including losses without stored energy) = net generation - exports + imports - absorbed
        energy. Net generation should be used. If a net generation output is not known, it shall be
        estimated.
      source_url: https://eepublicdownloads.blob.core.windows.net/public-cdn-container/clean-documents/mc-documents/transparency-platform/MOP/MoP_v3r5_final.zip
      ours: >-
        Average total load of the bidding zone over [interval_start, interval_end), UTC, in MW, as
        net generation minus net exports minus storage absorption, losses included.
    notes: >-
      Quote from MoP Ref2 "Detailed Data Descriptions" v3r5, article 6.1.A (list bullets joined).
      Unit published as MAW (megawatt, average over the MTU); the adapter checks quantity_unit = MAW.
      Own class instead of consumption_actual, for two reasons a human must weigh before merging them:
      (1) definition: net-generation based, storage absorption deducted, estimated where unmeasured,
      whereas consumption_actual is measured or settled gross consumption (Energi Data Service
      GrossCon includes transmission loss; whether it nets out power-plant own use is not stated);
      (2) dimension: average MW per MTU versus energy per interval. Feature 4 accepts only
      consumption_actual today, so the Netherlands gets no F4 value from ENTSO-E until this is decided.
      Resolution varies by zone and date; read it from each Period. Not on ENTSO-E's CC-BY 4.0 free
      re-use list (2023-10-18).
not_ingested: []
